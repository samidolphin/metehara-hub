        let currentLang = 'am';

        // 3. Render News Dynamic Multi-lingual Cards
        function renderNews() {
            const container = document.getElementById('news-container');
            if (!container) return;
            container.innerHTML = '';

            newsList.forEach(item => {
                const data = item[currentLang] || item['am'];
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden card-hover flex flex-col justify-between';

                const mediaHtml = item.video ? 
                    `<div class="w-full h-48"><iframe class="w-full h-full" src="${item.video}" frameborder="0" allowfullscreen></iframe></div>` : 
                    `<img src="${item.img}" class="w-full h-48 object-cover" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800'">`;

                const safeTitle = data.title.replace(/'/g, "\\'");
                const safeFull = data.full.replace(/'/g, "\\'").replace(/\n/g, "\\n");

                card.innerHTML = `
                    <div>
                        ${mediaHtml}
                        <div class="p-4 space-y-2">
                            <span class="text-xs text-amber-500 bg-amber-500/10 px-2.5 py-1 rounded-full font-semibold">${data.badge}</span>
                            <h4 class="font-bold text-lg text-white">${data.title}</h4>
                            <p class="text-slate-400 text-sm line-clamp-3">${data.desc}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="openReadMore('${safeTitle}', '${safeFull}', '${item.img}', '${item.video}')" class="text-amber-500 hover:text-amber-400 text-sm font-semibold flex items-center gap-1">
                            <span>${translations[currentLang].readMore}</span> <i class="fas fa-arrow-left text-xs"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 4. Change Language Function
        function changeLanguage(lang) {
            currentLang = lang;
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            renderNews(); // Refresh news cards to the selected language
        }

        function toggleAdminModal() {
            const modal = document.getElementById('adminModal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === '1234') {
                document.getElementById('passSection').classList.add('hidden');
                document.getElementById('postSection').classList.remove('hidden');
            } else {
                alert('የተሳሳተ የይለፍ ቃል ነው!');
            }
        }

        function addNewsPost() {
            const category = document.getElementById('postCategory').value;
            const title = document.getElementById('postTitle').value;
            const img = document.getElementById('postImg').value || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800';
            const desc = document.getElementById('postDesc').value;
            const video = document.getElementById('postVideo').value;

            if (!title || !desc) {
                alert('እባክዎን ርዕስ እና ዝርዝር ጽሑፉን ይሙሉ!');
                return;
            }

            // Create new entry
            const newItem = {
                id: Date.now(),
                img: img,
                video: video,
                am: { badge: "አዲስ", title: title, desc: desc, full: desc },
                om: { badge: "Haaraa", title: title, desc: desc, full: desc },
                en: { badge: "New", title: title, desc: desc, full: desc }
            };

            newsList.unshift(newItem);
            renderNews();

            document.getElementById('postTitle').value = '';
            document.getElementById('postImg').value = '';
            document.getElementById('postVideo').value = '';
            document.getElementById('postDesc').value = '';
            toggleAdminModal();

            alert('መረጃው በስኬት ተለጥፏል!');
        }

        function openReadMore(title, desc, img, video) {
            document.getElementById('readMoreTitle').innerText = title;
            document.getElementById('readMoreDesc').innerText = desc;
            
            const mediaContainer = document.getElementById('readMoreMedia');
            if (video) {
                mediaContainer.innerHTML = `<div class="w-full h-64 md:h-80"><iframe class="w-full h-full rounded-2xl" src="${video}" frameborder="0" allowfullscreen></iframe></div>`;
            } else if (img) {
                mediaContainer.innerHTML = `<img src="${img}" class="w-full h-64 md:h-80 object-cover rounded-2xl" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800'">`;
            } else {
                mediaContainer.innerHTML = '';
            }

            document.getElementById('readMoreModal').style.display = 'flex';
        }

        function closeReadMore() {
            document.getElementById('readMoreModal').style.display = 'none';
        }

        function subscribeNewsletter(e) {
            e.preventDefault();
            const email = document.getElementById('subscribeEmail').value;
            if (email) {
                alert('እናመሰግናለን! ' + email + ' በስኬት ተመዝግቧል።');
                document.getElementById('subscribeEmail').value = '';
            }
        }

        // Initialize News on Page Load
        window.onload = function() {
            renderNews();
        };
