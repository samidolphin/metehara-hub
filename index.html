<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metehara Town News Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        header {
            background: #0056b3;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .news-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .news-img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            display: block;
        }
        .news-content {
            padding: 20px;
        }
        .badge {
            background: #28a745;
            color: white;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .news-title {
            font-size: 22px;
            margin-bottom: 10px;
            color: #111;
        }
        .news-desc {
            font-size: 15px;
            color: #555;
            margin-bottom: 15px;
        }
        .news-full {
            white-space: pre-line;
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #0056b3;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Metehara Town Media & Information Hub</h1>
        </header>

        <!-- ዜናዎች የሚታዩበት ዋና ቦታ -->
        <div id="news-container"></div>
    </div>

    <script>
        // የዜናዎች መረጃ (Data Array)
        const newsList = [
            {
                id: 1,
                img: "763318662_27813225308308215_4177930533862144705_n.jpg",
                video: "",
                am: {
                    badge: "አዲስ ልማት",
                    title: "የኦሮሚያ ክልል ፕሬዝዳንት አቶ ሽመልስ አብዲሳ አዲስ የተገነባውን የበሰቃ ሎጅ ጎበኙ",
                    desc: "በመተሃራ ከተማ አስተዳደር ሙሉ በሙሉ በ103 ሚሊዮን ብር ወጪ የተገነባውና በ4.6 ሄክታር መሬት ላይ ያረፈው የበሰቃ ሎጅ በፕሬዝዳንት አቶ ሽመልስ አብዲሳ ተጎበኘ።",
                    full: `መተሃራ — የኦሮሚያ ብሔራዊ ክልላዊ መንግሥት ፕሬዝዳንት አቶ ሽመልስ አብዲሳ በበሰቃ ሐይቅ ዳርቻ አዲስ ተገንብቶ ይጠናቀቀውን የበሰቃ ሎጅ (Basaqaa Lodge) በይፋ ተዘዋውረው ጎብኝተዋል።\n\nየመተሃራ ከተማ አስተዳደር ከንቲባ አቶ አዲሱ ዋቆ እንደገለጹት፣ ፕሮጀክቱ በይፋ ተገንብቶ ለማጠናቀቅ 103 ሚሊዮን ብር የፈጀ ሲሆን፣ ወጪውም ሙሉ በሙሉ በመተሃራ ከተማ አስተዳደር የተሸፈነ ነው። ፕሮጀክቱ በሐይቁ ዳርቻ 4.6 ሄክታር መሬት ላይ ያረፈ ነው።\n\nአዲሱ የልማት ውህድ (Complex) የሚከተሉትን ዋና ዋና አገልግሎቶች ያካተተ ነው፦\n• የመዝናኛ አገልግሎቶች፦ ለህዝብ አገልግሎት የሚሰጡ የተሟሉ መሠረተ ልማቶች እና ልዩ የመዝናኛ ስፍራዎች።\n• የውሃ ትራንስፖርት መሠረተ ልማት፦ ለመዝናኛ ጀልባዎች የሚሆን የመርከብ ማቆሚያ (Docking) እና የክወና መሠረተ ልማት።\n• የሎጅስቲክስ እና የፓርኪንግ ስፍራ፦ ለጎብኚዎች እና ለትራንስፖርት ተሽከርካሪዎች የሚያገለግል ዘመናዊ የፓርኪንግ ቦታ።\n\nከንቲባ አቶ አዲሱ ዋቆ አክለው እንደገለጹት፣ የበሰቃ ሎጅ መገንባት የአካባቢውን የተፈጥሮ ቱሪዝም (Eco-tourism) በከፍተኛ ደረጃ የሚያነቃቃ ከመሆኑም በላይ፣ በክልሉ የሆቴልና ቱሪዝም ዘርፍ በርካታ የሥራ ዕድሎችን እንደሚፈጥር ይጠበቃል።`
                }
            },
            {
                id: 2,
                img: "765035605_27839407149023364_6600243663990638006_n.jpg",
                video: "",
                am: {
                    badge: "አረንጓዴ ልማት",
                    title: "ከቆሻሻ ማከማቻነት ወደ አረንጓዴ ገነት፤ የበሰቃ ሐይቅ ዳርቻ ያስደነቀው የልማት ታሪክ!",
                    desc: "ቀደም ሲል የከተማዋ የቆሻሻ ማከማቻ የነበረው የበሰቃ ሐይቅ ዳርቻ ወደ ውብ አረንጓዴ ልማትና ፍራፍሬ ቦታነት መቀየሩን የክልሉ ፕሬዝዳንት አቶ ሽመልስ አብዲሳ ተዘዋውረው ጎበኙ።",
                    full: `መተሃራ — ቀደም ሲል የመተሃራ ከተማ የቆሻሻ መጣያና ማከማቻ ስፍራ ሆኖ ያገለግል የነበረው የበሰቃ ሐይቅ ዳርቻ፣ በተደረገው ከፍተኛ የኮሪደር እና የአረንጓዴ ልማት ሥራ ሙሉ በሙሉ ገጽታው ተቀይሮ ወደ አረንጓዴ ገነትነት ተለውጧል።\n\nየኦሮሚያ ክልል ፕሬዝዳንት አቶ ሽመልስ አብዲሳ በመተሃራ ከተማ ከንቲባ አቶ አዲሱ ዋቆ ታጅበው በቦታው ተገኝተው የለማውን አረንጓዴ ስፍራ፣ የእግር መንገድ እና የተተከሉ የብርቱካንና የፍራፍሬ ተክሎችን ተዘዋውረው ጎብኝተዋል።\n\nየመተሃራ ከተማ አስተዳደር ባከናወነው በዚህ አስደናቂ ፕሮጀክት፦\n• የአካባቢ ጥበቃ፦ ቀደም ሲል ለብክለት የተጋለጠውን የሐይቁን ዳርቻ ወደ ጸዳና ለዓይን የሚስብ የተፈጥሮ ስፍራነት ቀይሮታል።\n• የከተማ ግብርና እና አረንጓዴ ልማት፦ በሐይቁ ዳርቻ በስፋት የተተከሉ የብርቱካን እና የተለያዩ አረንጓዴ ተክሎች ለአካባቢው የተፈጥሮ ውበት ከመስጠታቸውም በላይ የከተማ ግብርናን የሚያበረታቱ ናቸው።\n• የኮሪደር ልማት፦ ለነዋሪዎችና ለጎብኚዎች የሚሆን ውብ የእግር መንገድ እና የመዝናኛ ስፍራ ተዘጋጅቷል።`
                }
            }
        ];

        // ዜናዎችን በገጹ ላይ የመስሪያ Function
        function displayNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = newsList.map(item => `
                <div class="news-card">
                    <img class="news-img" src="${item.img}" alt="${item.am.title}">
                    <div class="news-content">
                        <span class="badge">${item.am.badge}</span>
                        <h2 class="news-title">${item.am.title}</h2>
                        <p class="news-desc"><strong>${item.am.desc}</strong></p>
                        <div class="news-full">${item.am.full}</div>
                    </div>
                </div>
            `).join('');
        }

        // ገጹ ሲከፈት እንዲሰራ ማድረግ
        displayNews();
    </script>
</body>
</html>
