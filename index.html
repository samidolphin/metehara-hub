<!-- ወቅታዊ ዜናዎች ክፍል (Auto-Motion Section) -->
<section style="max-width: 800px; margin: 40px auto; text-align: center;">
    <h2 style="margin-bottom: 20px;">ወቅታዊ ዜናዎች</h2>
    
    <div style="position: relative; height: 350px; overflow: hidden; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        
        <!-- የዜና ስላይዶች -->
        <div class="news-slide active" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out;">
            <img src="oromia_president.jpg" alt="የኦሮሚያ ፕሬዝዳንት" style="width: 100%; height: 100%; object-fit: cover;">
            <div style="position: absolute; bottom: 0; background: rgba(0,0,0,0.6); width: 100%; padding: 10px;">የኦሮሚያ ፕሬዝዳንት ወቅታዊ ጉብኝት</div>
        </div>

        <div class="news-slide" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out;">
            <img src="mataahara_mayor.jpg" alt="የመታሃራ ከተማ ከንቲባ" style="width: 100%; height: 100%; object-fit: cover;">
            <div style="position: absolute; bottom: 0; background: rgba(0,0,0,0.6); width: 100%; padding: 10px;">የመታሃራ ከተማ አስተዳደር ከንቲባ መግለጫ</div>
        </div>

        <div class="news-slide" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out;">
            <img src="general_news.jpg" alt="ሌሎች ዜናዎች" style="width: 100%; height: 100%; object-fit: cover;">
            <div style="position: absolute; bottom: 0; background: rgba(0,0,0,0.6); width: 100%; padding: 10px;">ሌሎች ወቅታዊ የከተማው ዜናዎች</div>
        </div>
    </div>
</section>

<script>
    // የዜናው ስላይድ በየ 3 ሰከንዱ እንዲቀያየር
    let newsSlides = document.querySelectorAll('.news-slide');
    let nIndex = 0;
    
    // መጀመሪያ ላይ የመጀመሪያውን እናሳይ
    newsSlides[0].classList.add('active');
    newsSlides[0].style.opacity = "1";

    setInterval(() => {
        newsSlides[nIndex].style.opacity = "0";
        newsSlides[nIndex].classList.remove('active');
        
        nIndex = (nIndex + 1) % newsSlides.length;
        
        newsSlides[nIndex].style.opacity = "1";
        newsSlides[nIndex].classList.add('active');
    }, 3000); // 3000 ማለት 3 ሰከንድ ነው
</script>
