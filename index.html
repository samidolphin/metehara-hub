<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Mataaharaa Town Hub | መታሃራ መረጃ ማዕከል</title>
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #e67e22; }
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .admin-card { background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .admin-form { display: grid; gap: 10px; }
        .slider-box { position: relative; height: 350px; overflow: hidden; background: #000; border-radius: 10px; }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 1s; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }
        .post-item { background: white; padding: 15px; margin: 10px 0; cursor: pointer; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <!-- አድሚን ፓነል -->
    <div class="admin-card">
        <h3>⚙️ አዲስ ዜና እና ፎቶዎች መጫኛ</h3>
        <div class="admin-form">
            <input type="text" id="pTitle" placeholder="የዜናው ርዕስ">
            <input type="text" id="img1" placeholder="የፎቶ 1 ሊንክ (URL)">
            <input type="text" id="img2" placeholder="የፎቶ 2 ሊንክ (URL)">
            <input type="text" id="img3" placeholder="የፎቶ 3 ሊንክ (URL)">
            <button onclick="addPost()">ዜናውን ለቀቅ</button>
        </div>
    </div>

    <!-- ሞሽን ስላይደር -->
    <div class="slider-box" id="slider">
        <div class="slide active" id="s1"></div>
        <div class="slide" id="s2"></div>
        <div class="slide" id="s3"></div>
    </div>

    <!-- የዜና ዝርዝር -->
    <div id="newsList"></div>
</div>

<script>
    let posts = [];
    let currentSlide = 0;
    let slideInterval;

    function addPost() {
        const post = {
            title: document.getElementById('pTitle').value,
            images: [
                document.getElementById('img1').value,
                document.getElementById('img2').value,
                document.getElementById('img3').value
            ]
        };
        posts.push(post);
        renderPosts();
    }

    function renderPosts() {
        const list = document.getElementById('newsList');
        list.innerHTML = '<h3>የተለቀቁ ዜናዎች</h3>';
        posts.forEach((p, index) => {
            list.innerHTML += `<div class="post-item" onclick="loadPost(${index})"><h4>${p.title}</h4></div>`;
        });
    }

    function loadPost(index) {
        const post = posts[index];
        document.getElementById('s1').style.backgroundImage = `url('${post.images[0]}')`;
        document.getElementById('s2').style.backgroundImage = `url('${post.images[1]}')`;
        document.getElementById('s3').style.backgroundImage = `url('${post.images[2]}')`;
        
        // ሞሽኑን ለማስጀመር
        clearInterval(slideInterval);
        startSlider();
    }

    function startSlider() {
        let slides = document.querySelectorAll('.slide');
        currentSlide = 0;
        slideInterval = setInterval(() => {
            slides.forEach(s => s.classList.remove('active'));
            slides[currentSlide].classList.add('active');
            currentSlide = (currentSlide + 1) % slides.length;
        }, 3000);
    }
</script>
</body>
</html>
