<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mataaharaa Town Hub | መታሃራ መረጃ ማዕከል</title>
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #e67e22; --bg-color: #f4f4f9; }
        body { font-family: sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; }
        header { background: var(--primary-color); color: white; padding: 20px; text-align: center; }
        .container { width: 90%; max-width: 900px; margin: 20px auto; }
        
        /* Admin Panel */
        .admin-card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .admin-form input { width: 95%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: var(--accent-color); color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }

        /* Slider */
        .slider-box { position: relative; height: 350px; overflow: hidden; border-radius: 12px; background: #333; margin-bottom: 20px; }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }

        /* News Feed */
        .post-item { background: white; padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; border-radius: 5px; margin-bottom: 5px; }
        .post-item:hover { background: #fff3e0; }
    </style>
</head>
<body>

<header>
    <h1>የመታሃራ ከተማ መረጃ ማዕከል</h1>
</header>

<div class="container">
    <!-- አድሚን ፓነል -->
    <div class="admin-card">
        <h3>⚙️ አዲስ ዜና እና 3 ፎቶዎችን ጫን</h3>
        <input type="text" id="inTitle" placeholder="የዜናው ርዕስ...">
        <input type="text" id="inImg1" placeholder="የፎቶ 1 ሊንክ (URL)...">
        <input type="text" id="inImg2" placeholder="የፎቶ 2 ሊንክ (URL)...">
        <input type="text" id="inImg3" placeholder="የፎቶ 3 ሊንክ (URL)...">
        <button onclick="addPost()">ይዘት ልቀቅ (Publish)</button>
    </div>

    <!-- ሞሽን ስላይደር -->
    <div class="slider-box" id="slider">
        <div class="slide active" id="s1" style="background-image: url('');"></div>
        <div class="slide" id="s2" style="background-image: url('');"></div>
        <div class="slide" id="s3" style="background-image: url('');"></div>
    </div>

    <!-- የዜና ዝርዝር -->
    <div id="postsContainer">
        <h3>📌 የዜና ዝርዝር</h3>
    </div>
</div>

<script>
    let posts = [];
    let currentIndex = 0;
    let slideInterval;

    function addPost() {
        const p = {
            title: document.getElementById('inTitle').value,
            imgs: [
                document.getElementById('inImg1').value,
                document.getElementById('inImg2').value,
                document.getElementById('inImg3').value
            ]
        };
        posts.push(p);
        renderPosts();
        // Clear inputs
        document.getElementById('inTitle').value = '';
        document.getElementById('inImg1').value = '';
        document.getElementById('inImg2').value = '';
        document.getElementById('inImg3').value = '';
    }

    function renderPosts() {
        const container = document.getElementById('postsContainer');
        container.innerHTML = '<h3>📌 የዜና ዝርዝር</h3>';
        posts.forEach((p, index) => {
            container.innerHTML += `<div class="post-item" onclick="loadSlider(${index})"><h4>${p.title}</h4></div>`;
        });
    }

    function loadSlider(index) {
        const p = posts[index];
        // ፎቶዎችን ወደ ስላይደር መጫን
        document.getElementById('s1').style.backgroundImage = `url('${p.imgs[0]}')`;
        document.getElementById('s2').style.backgroundImage = `url('${p.imgs[1]}')`;
        document.getElementById('s3').style.backgroundImage = `url('${p.imgs[2]}')`;
        
        // አሮጌውን ሞሽን ማቆም እና አዲሱን መጀመር
        clearInterval(slideInterval);
        startAutoSlide();
    }

    function startAutoSlide() {
        let slides = document.querySelectorAll('.slide');
        let i = 0;
        slideInterval = setInterval(() => {
            slides.forEach(s => s.classList.remove('active'));
            slides[i].classList.add('active');
            i = (i + 1) % slides.length;
        }, 3000);
    }
</script>

</body>
</html>
