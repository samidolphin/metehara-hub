<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የመታሃራ መረጃ ማዕከል | Sami-Tube</title>
    <style>
        body { font-family: 'Abyssinica SIL', serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .admin-section { text-align: center; margin: 20px; }
        
        /* Gallery */
        .gallery-container { width: 80%; margin: auto; height: 350px; overflow: hidden; position: relative; border-radius: 10px; }
        .slide { width: 100%; height: 100%; background-size: cover; background-position: center; position: absolute; opacity: 0; transition: opacity 1s ease-in-out; }
        .slide.active { opacity: 1; }

        /* YouTube Section */
        .video-box { width: 80%; margin: 40px auto; text-align: center; }
        iframe { width: 100%; height: 400px; border-radius: 10px; }

        /* Newsletter */
        .newsletter { background: #34495e; color: white; padding: 30px; text-align: center; margin-top: 40px; }
        input[type="email"] { padding: 10px; width: 300px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #e67e22; border: none; color: white; cursor: pointer; border-radius: 5px; }

        /* Footer */
        footer { background: #222; color: #ccc; padding: 20px; text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>እንኳን ወደ መታሃራ መረጃ ማዕከል በደህና መጡ</h1>
</header>

<!-- Admin Section (Dropdown) -->
<div class="admin-section">
    <h3>አድሚን: መረጃ መጫኛ</h3>
    <select id="contentCategory">
        <option value="news">ወቅታዊ ዜና</option>
        <option value="culture">ባህልና ወግ</option>
        <option value="tourism">የተፈጥሮ ፀጋ</option>
        <option value="events">ቱሪዝም</option>
    </select>
    <button onclick="alert('ክፍል ' + document.getElementById('contentCategory').value + ' ተመርጧል። ፋይሎችን ይስቀሉ')">ይዘት ይጫኑ</button>
</div>

<!-- Auto-Sliding Gallery -->
<div class="gallery-container" id="gallery">
    <div class="slide active" style="background-image: url('nature1.jpg');"></div>
    <div class="slide" style="background-image: url('culture1.jpg');"></div>
    <div class="slide" style="background-image: url('tourism1.jpg');"></div>
</div>

<!-- YouTube Video -->
<div class="video-box">
    <h2>የመታሃራ የቅርብ ጊዜ ቪዲዮ</h2>
    <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
</div>

<!-- Newsletter -->
<div class="newsletter">
    <h3>ለተከታታይ መረጃ በኢሜይል ይመዝገቡ</h3>
    <input type="email" placeholder="ኢሜይል አድራሻዎን ያስገቡ">
    <button>ይመዝገቡ</button>
</div>

<footer>
    <p>ስልክ ቁጥር፦ +251911926976</p>
    <p>ኢሜይል፦ sami2all@gmail.com</p>
    <p>© 2026 የመታሃራ መረጃ ማዕከል - በሳሚ የተዘጋጀ</p>
</footer>

<script>
    // Gallery Auto-Motion Script
    let slides = document.querySelectorAll('.slide');
    let index = 0;
    setInterval(() => {
        slides[index].classList.remove('active');
        index = (index + 1) % slides.length;
        slides[index].classList.add('active');
    }, 3000); // በየ 3 ሰከንዱ ይቀያይራል
</script>

</body>
</html>
